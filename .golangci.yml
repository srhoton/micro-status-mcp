version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - goconst
    - revive
    - gosec

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    govet:
      enable:
        - shadow
    errcheck:
      check-type-assertions: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
